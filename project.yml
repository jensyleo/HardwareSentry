name: HardwareSentry
options:
  bundleIdPrefix: com.jensyleo
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  HardwareSentryCore:
    path: HardwareSentryCore

targets:
  HardwareSentry:
    type: application
    platform: macOS
    sources:
      - path: HardwareSentry
    info:
      path: HardwareSentry/Info.plist
      properties:
        # Read from the build settings rather than written here, so the version lives in
        # one place (MARKETING_VERSION below). Without these, `xcodegen generate` writes
        # its own literal "1.0" into Info.plist and every build reports that instead.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: "HardwareSentry watches for Bluetooth devices connecting and disconnecting, and for the Bluetooth radio's own state, so it can notify you about them."
        # Asked once, before the mic-in-use listener is armed — see
        # CoreAudioSource.requestMicrophoneAccessIfNeeded(). Nothing here ever records or
        # reads audio; it only watches whether some process is using the microphone, to
        # notify about that.
        # Asked the first time a mounted network drive's server is checked: that is a
        # connection to another machine on the local network, which macOS gates behind its
        # Local Network permission. Nothing is sent but the connection itself.
        NSLocalNetworkUsageDescription: "HardwareSentry checks that the server of a network drive you have mounted is still answering, so it can tell you when it stops. It only opens a connection to that server; nothing is sent or read."
        NSMicrophoneUsageDescription: "HardwareSentry watches whether the microphone is being used, so it can notify you when it starts or stops. Audio itself is never recorded or read."
        # Reading the Wi-Fi network's own name (SSID) has required Location authorization
        # since macOS 10.14, regardless of sandboxing — the location itself is never read,
        # only the permission it unlocks.
        NSLocationUsageDescription: "HardwareSentry uses Location access only to read the name of the Wi-Fi network you join, so it can notify you about it. Your location is never read or stored."
        NSLocationWhenInUseUsageDescription: "HardwareSentry uses Location access only to read the name of the Wi-Fi network you join, so it can notify you about it. Your location is never read or stored."
        # The application's own icon, replacing the HG4MAC one that stood in until it
        # was drawn — the last inherited asset in the bundle. Built from
        # Icons/AppIcon-source.png by Tools/make-app-icon.py; see that script for why
        # the artwork cannot simply be shipped as it comes.
        CFBundleIconFile: AppIcon
        # Without this, every polling loop in the application is throttled.
        #
        # A menu-bar accessory is always in the background, which is exactly what App Nap
        # exists to slow down: a timer set for twelve seconds can be stretched to minutes
        # or stalled outright. Everything that has to ask rather than be told — the Wi-Fi
        # signal level, the radio's backstop check, the printer's destination list, a
        # scanner's status, the power repeat, the weekly battery check — quietly stops
        # working, while everything driven by a system notification carries on. That
        # combination looks like "the signal-level feature is broken" rather than like
        # power management, which is how it was reported. The original sets this for the
        # same reason and says so in its own notes.
        LSAppNapIsDisabled: true
    dependencies:
      - package: HardwareSentryCore
        product: MonitorRegistry
      - package: HardwareSentryCore
        product: SentryContract
      - package: HardwareSentryCore
        product: SystemIcons
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jensyleo.hardwaresentry
        PRODUCT_NAME: HardwareSentry
        MARKETING_VERSION: "1.5.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        # Signed to run locally rather than left to the linker: the system's notification
        # service refuses a linker-signed application outright, which would leave the app
        # able to draw its own banners but never to use the real thing.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
